<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .game-container {
            text-align: center;
            background: #ffffff;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            max-width: 650px;
            width: 100%;
        }
        h1 { 
            color: #2c5364; 
            margin-bottom: 30px; 
            font-size: 3.5em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        .score-board {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .score-item { 
            padding: 20px 35px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            min-width: 180px;
        }
        .score-item strong {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1em;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .score-item span {
            display: block;
            color: #ffffff;
            font-size: 2.2em;
            font-weight: bold;
        }
        canvas {
            border: 4px solid #2c5364;
            border-radius: 15px;
            background: #1a1a1a;
            display: block;
            margin: 0 auto;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        .controls { 
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            border-left: 5px solid #667eea;
        }
        .controls p {
            color: #333;
            font-size: 1.2em;
            margin: 8px 0;
            font-weight: 500;
        }
        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 60px;
            border-radius: 25px;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            min-width: 400px;
        }
        .game-over h2 { 
            font-size: 3em;
            margin-bottom: 25px;
            color: #ff6b6b;
        }
        .game-over p {
            font-size: 1.8em;
            margin-bottom: 30px;
        }
        .game-over button {
            padding: 18px 50px;
            font-size: 1.4em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .game-over button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        .game-over button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 贪吃蛇</h1>
        <div class="score-board">
            <div class="score-item"><strong>得分：</strong><span id="score">0</span></div>
            <div class="score-item"><strong>最高分：</strong><span id="highScore">0</span></div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <p>使用方向键 ↑ ↓ ← → 控制蛇的移动</p>
            <p>按空格键暂停/继续游戏</p>
        </div>
    </div>
    <div class="game-over" id="gameOver">
        <h2>游戏结束！</h2>
        <p style="font-size: 1.5em; margin-bottom: 20px;">得分：<span id="finalScore">0</span></p>
        <button onclick="restartGame()">重新开始</button>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 0, dy = 0, score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop, isPaused = false, gameStarted = false;
        highScoreElement.textContent = highScore;
        document.addEventListener('keydown', changeDirection);
        function changeDirection(event) {
            const key = event.key;
            if (key === ' ') {
                event.preventDefault();
                if (gameStarted) isPaused = !isPaused;
                return;
            }
            if (!gameStarted) {
                gameStarted = true;
                gameLoop = setInterval(update, 100);
            }
            if (key === 'ArrowUp' && dy === 0) { dx = 0; dy = -1; }
            else if (key === 'ArrowDown' && dy === 0) { dx = 0; dy = 1; }
            else if (key === 'ArrowLeft' && dx === 0) { dx = -1; dy = 0; }
            else if (key === 'ArrowRight' && dx === 0) { dx = 1; dy = 0; }
        }
        function update() {
            if (isPaused) return;
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || checkSelfCollision(head)) {
                endGame();
                return;
            }
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                generateFood();
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }
            } else {
                snake.pop();
            }
            draw();
        }
        function checkSelfCollision(head) {
            return snake.some(segment => segment.x === head.x && segment.y === head.y);
        }
        function generateFood() {
            do {
                food.x = Math.floor(Math.random() * tileCount);
                food.y = Math.floor(Math.random() * tileCount);
            } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
        }
        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#111';
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? '#4ade80' : '#22c55e';
                ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
                if (index === 0) {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 5, 3, 3);
                    ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 5, 3, 3);
                }
            });
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
        }
        function endGame() {
            clearInterval(gameLoop);
            finalScoreElement.textContent = score;
            gameOverElement.style.display = 'block';
        }
        function restartGame() {
            snake = [{x: 10, y: 10}];
            food = {x: 15, y: 15};
            dx = 0; dy = 0; score = 0;
            isPaused = false; gameStarted = false;
            scoreElement.textContent = score;
            gameOverElement.style.display = 'none';
            draw();
        }
        draw();
    </script>
</body>
</html>
